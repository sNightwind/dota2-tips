[package]
name = "dota2-tips"
version = "0.3.0"
edition = "2024"

[dependencies]
ctrlc = "3"
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
toml = "1.2.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
